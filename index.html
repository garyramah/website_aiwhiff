<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiwhiff</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2d;
        --text: #edf3ff;
        --muted: #aab9d6;
        --accent: #6ee7b7;
        --accent-2: #7dd3fc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827 45%, #0f172a);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        width: min(760px, calc(100% - 32px));
        background: rgba(18, 26, 45, 0.85);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.28);
        padding: 48px 32px;
      }

      .eyebrow {
        display: inline-block;
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.5rem, 6vw, 5rem);
        line-height: 1;
      }

      .accent {
        color: var(--accent-2);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #06131c;
      }

      .button.secondary {
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">website_aiwhiff</div>
      <h1>Build smarter <span class="accent">AI</span> experiences.</h1>
      <p>
        This is a simple starter homepage for aiwhiff. Replace this content with your product,
        brand message, or landing page copy as needed.
      </p>
      <div class="actions">
        <a class="button primary" href="#">Get started</a>
        <a class="button secondary" href="#">Learn more</a>
      </div>
    </main>
  </body>
</html>
